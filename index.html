<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Calculadora de IMC</h1>

    <form id="form-imc">
      <label for="peso">Peso (kg)</label>
      <input type="number" id="peso" name="peso" step="0.1" min="0" required>

      <label for="altura">Altura (m)</label>
      <input type="number" id="altura" name="altura" step="0.01" min="0" required>

      <button type="submit">Calcular</button>
    </form>

    <section id="resultado" class="resultado" hidden>
      <p>Seu IMC é <strong id="valor-imc"></strong></p>
      <p id="classificacao-imc"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
